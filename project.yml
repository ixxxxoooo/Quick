name: Quick
options:
  bundleIdPrefix: com.ygw
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  QuickCore:
    path: Packages/QuickCore
  QuickUI:
    path: Packages/QuickUI
  QuickPlatform:
    path: Packages/QuickPlatform
  PluginLauncher:
    path: Packages/PluginLauncher
  PluginClipboard:
    path: Packages/PluginClipboard
  PluginCalculator:
    path: Packages/PluginCalculator
  PluginSystemControl:
    path: Packages/PluginSystemControl
  PluginFileSearch:
    path: Packages/PluginFileSearch
  PluginSnippets:
    path: Packages/PluginSnippets
  PluginOCR:
    path: Packages/PluginOCR
  PluginTranslator:
    path: Packages/PluginTranslator
  PluginDevTools:
    path: Packages/PluginDevTools
  PluginCalendar:
    path: Packages/PluginCalendar
  PluginWeather:
    path: Packages/PluginWeather
  PluginNotes:
    path: Packages/PluginNotes
  PluginAI:
    path: Packages/PluginAI
  PluginWindowManager:
    path: Packages/PluginWindowManager
  PluginSystemMonitor:
    path: Packages/PluginSystemMonitor
  PluginNetworkTools:
    path: Packages/PluginNetworkTools
  PluginScreenshot:
    path: Packages/PluginScreenshot

targets:
  Quick:
    type: application
    platform: macOS
    sources:
      - Quick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ygw.quick
        INFOPLIST_FILE: Quick/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Quick/Quick.entitlements
        # 自签名身份「Quick」：TCC 按 certificate leaf 认 App，必须稳定（见 Scripts/generate-signing-cert.sh）
        CODE_SIGN_IDENTITY: Quick
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        PRODUCT_NAME: Quick
        PRODUCT_MODULE_NAME: Quick
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: true
      configs:
        Debug:
          # 独立开发频道：与正式版隔离 TCC / 偏好 / 日志子系统
          PRODUCT_NAME: Quick Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.ygw.quick.dev
          # Xcode 16+ 默认把 Debug 代码放进 .debug.dylib，主可执行只剩壳 → TCC 认不出稳定身份
          ENABLE_DEBUG_DYLIB: NO
        Release:
          PRODUCT_NAME: Quick
          PRODUCT_BUNDLE_IDENTIFIER: com.ygw.quick
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          COPY_PHASE_STRIP: YES
    dependencies:
      - package: QuickCore
      - package: QuickUI
      - package: QuickPlatform
      - package: PluginLauncher
      - package: PluginClipboard
      - package: PluginCalculator
      - package: PluginSystemControl
      - package: PluginFileSearch
      - package: PluginSnippets
      - package: PluginOCR
      - package: PluginTranslator
      - package: PluginDevTools
      - package: PluginCalendar
      - package: PluginWeather
      - package: PluginNotes
      - package: PluginAI
      - package: PluginWindowManager
      - package: PluginSystemMonitor
      - package: PluginNetworkTools
      - package: PluginScreenshot
