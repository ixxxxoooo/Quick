name: Release

on:
  push:
    tags:
      - "v*"
  # 手动触发只做「构建 + 上传 artifact」，不建 release：
  # 用来在真机 runner 上验证打包流程，通过了再打 tag。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build DMG & Create Release
    # 工程的部署目标是 macOS 26，构建/签名/排版/打包全部交给 Scripts/build-dmg.sh。
    # runner 上没有本机的自签名证书「Quick」，所以下面那步先把证书从 secrets 导进
    # 临时钥匙串：build-dmg.sh 找不到证书就拒绝产出 ad-hoc 签名的 DMG。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XCODE" ] || XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using ${XCODE}"
          sudo xcode-select -s "$XCODE"

      # 签名身份必须**和本地、和历史版本一致**：TCC（屏幕录制等）把授权记在 App 的
      # 代码签名身份上。ad-hoc 签名的身份是 cdhash（这一个二进制的指纹），每次构建都变，
      # 用户每次升级都要重新授权一遍；用同一张证书签，要求就一直是
      # `identifier + certificate leaf`，重装 / 升级都认同一份授权。
      #
      # 一次性配置（见 AGENTS.md「发布」一节）：
      #   本机导出 → QUICK_CERT_P12_BASE64、QUICK_CERT_P12_PASSWORD 两个 secrets
      #
      # 打 tag 的正式发布**必须有**证书：ad-hoc 签出来的 App，签名身份每次构建都变，
      # 用户每升级一次就要重新授权一次屏幕录制。手动 workflow_dispatch 只是验打包流程，
      # 允许降级（相当于 QUICK_ALLOW_ADHOC=1），但要显眼地警告。
      - name: Import signing identity
        env:
          P12_BASE64: ${{ secrets.QUICK_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.QUICK_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12_BASE64:-}" ]; then
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              echo "::error::secrets 里没有 QUICK_CERT_P12_BASE64。没有这张证书只能 ad-hoc 签名，"
              echo "::error::那样用户每升级一次就要重新授权一次屏幕录制（见 AGENTS.md「发布」一节）。"
              exit 1
            fi
            echo "::warning::没有签名证书，本次（手动触发、非发布）退回 ad-hoc 签名，产物不适合发给用户"
            echo "QUICK_ALLOW_ADHOC=1" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/quick-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/quick.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/quick.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # codesign 用私钥时要过这道 ACL，少了它就会卡在「钥匙串授权」上。
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/quick.p12"
          security find-identity -p codesigning | grep '"Quick"' \
            || { echo "::error::导入后仍然找不到「Quick」身份"; exit 1; }

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 不要再单独 xcodebuild 一次：那样会绕开 build-dmg.sh 里的签名身份守门。
      - name: Build DMG
        run: bash Scripts/build-dmg.sh

      # 私钥只在这个 job 里活着：钥匙串连同临时文件一起删掉。
      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/quick-signing.keychain-db" || true

      - name: Compute checksums
        id: checksum
        run: |
          DMG_PATH="$(ls dist/Quick-*.dmg)"
          SHA256="$(shasum -a 256 "$DMG_PATH" | cut -d' ' -f1)"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$(basename "$DMG_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v6
        with:
          name: Quick-${{ github.ref_name }}
          path: ${{ steps.checksum.outputs.dmg_path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Quick ${{ steps.version.outputs.version }}
          body: |
            ## Quick ${{ steps.version.outputs.version }}

            ### Installation

            1. Download `${{ steps.checksum.outputs.dmg_name }}` below.
            2. Open the DMG and drag **Quick.app** onto the **Applications** folder.
            3. Before first launch, remove the quarantine flag in Terminal:
               ```
               xattr -dr com.apple.quarantine /Applications/Quick.app
               ```
               The DMG also ships `安装说明.txt` — the same line, ready to copy.

            ### Permissions

            - **Accessibility** (recommended): System Settings › Privacy & Security ›
              Accessibility → add Quick (or drag Quick.app in). Needed for paste /
              focus restore and some system actions.
            - **Screen Recording** (optional, screenshot module): System Settings ›
              Privacy & Security › Screen & System Audio Recording → add Quick.
              If Quick is listed but still reports "not granted", remove the row with
              **−**, add it again, and restart Quick.
            - **Input Monitoring** (optional, global hotkeys on some setups):
              Privacy & Security › Input Monitoring → add Quick.

            ### Checksum

            ```
            SHA-256: ${{ steps.checksum.outputs.sha256 }}
            ```
          files: ${{ steps.checksum.outputs.dmg_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
